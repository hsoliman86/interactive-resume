    <script>
        let radarChartInstance = null;

        function navigate(viewId) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            const activeView = document.getElementById(`view-${viewId}`);
            activeView.classList.remove('hidden');
            activeView.scrollIntoView();
            document.getElementById(`nav-${viewId}`).classList.add('nav-active');

            const titles = {
                overview: "Executive Dashboard",
                experience: "Career Path",
                tech: "Technical Arsenal",
                certifications: "Credentials & Education",
                contact: "Contact Me"
            };
            document.getElementById('view-title').innerText = titles[viewId];
        }

        window.onload = () => navigate('overview');
    </script>
